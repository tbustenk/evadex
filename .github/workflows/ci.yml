name: CI
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev,bridge,barcodes,data-formats,archives]"
      - name: Unit tests
        run: python -m pytest tests/unit -v --tb=short -q
      - name: Integration tests
        run: python -m pytest tests/integration -v --tb=short -q
      - name: Ruff
        run: |
          ruff check src/
          ruff format --check src/

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build base image
        run: docker build -f deploy/Dockerfile -t evadex:latest .
      - name: Test base image
        run: docker run --rm evadex:latest --help
      - name: Build bridge image
        run: docker build -f deploy/Dockerfile.bridge -t evadex-bridge:latest .
      - name: Test bridge health
        run: |
          docker run -d --name evadex-bridge -p 8081:8081 evadex-bridge:latest
          sleep 5
          curl --fail http://localhost:8081/healthz
          docker stop evadex-bridge
